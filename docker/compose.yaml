# App stack for the re-platformed tool (ADR 015/016).
#
#   docker compose --profile app up --build
#       -> db (PostgreSQL) + middle (Express) + front (nginx :8080).
#          The middle uses the PostgreSQL back end by default. Seed the db for
#          a local demo (see LIVRAISON.md « Tester en local avec Docker »); in
#          production the store is populated by the client's import/sync.
#
#   Set KANBAN_STORAGE_DRIVER=jsonl on the middle to run the file store instead
#   (single-writer; then mount a durable volume on /data).
name: portfolio-kanban
services:
  db:
    profiles: ["app"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thuglife}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban}"]
      interval: 5s
      timeout: 3s
      retries: 10

  middle:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.middle
    environment:
      KANBAN_HOST: 0.0.0.0
      KANBAN_PORT: "8787"
      KANBAN_STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-thuglife}@db:5432/${POSTGRES_DB:-kanban}
      # Append-only log enforced by default (1). Set KANBAN_PG_APPEND_ONLY=0 to
      # drop the guard for a DEMO (direct DB hand-edits). Keep 1 in production.
      KANBAN_PG_APPEND_ONLY: "${KANBAN_PG_APPEND_ONLY:-1}"
      # dataDir for the admin config override + its history (small, persisted).
      KANBAN_DATA_PATH: /app/data/board.jsonl
    volumes:
      - config-data:/app/data
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

  front:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.front
    environment:
      MIDDLE_HOST: middle
      MIDDLE_PORT: "8787"
    ports:
      - "8080:80"
    depends_on:
      - middle

  # Web DB editor for DEMO/DEV only (profil `tools`, jamais en production).
  #   docker compose --profile app --profile tools up
  #   -> http://localhost:8081  (Système PostgreSQL · Serveur db · kanban / thuglife · base kanban)
  adminer:
    profiles: ["tools"]
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db-data:
  config-data:
