# App stack for the re-platformed tool (ADR 015/016).
#
#   docker compose --profile app up --build
#       -> db (PostgreSQL) + middle (Express) + front (nginx :8080).
#          The middle uses the PostgreSQL back end by default. Seed the db for
#          a local demo (see LIVRAISON.md « Tester en local avec Docker »); in
#          production the store is populated by the client's import/sync.
#
#   Set KANBAN_STORAGE_DRIVER=jsonl on the middle to run the file store instead
#   (single-writer; then mount a durable volume on /data).
name: portfolio-kanban
services:
  db:
    profiles: ["app"]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thuglife}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    # Loopback-bound: the dev-password database is never reachable beyond this
    # machine. Drop the 127.0.0.1 prefix only for a deliberately shared host.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban}"]
      interval: 5s
      timeout: 3s
      retries: 10

  middle:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.middle
      # Proxy d'entreprise : transmis au conteneur de BUILD (le npm ci interne
      # n'hérite ni du shell ni du démon — vu sur la VM client). Vide ailleurs,
      # donc sans effet hors proxy ; BuildKit les exclut du cache.
      args:
        HTTP_PROXY: ${http_proxy:-}
        HTTPS_PROXY: ${https_proxy:-}
        NO_PROXY: ${no_proxy:-}
    environment:
      KANBAN_HOST: 0.0.0.0
      KANBAN_PORT: "8787"
      KANBAN_STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-kanban}:${POSTGRES_PASSWORD:-thuglife}@db:5432/${POSTGRES_DB:-kanban}
      # Append-only log enforced by default (1). Set KANBAN_PG_APPEND_ONLY=0 to
      # drop the guard for a DEMO (direct DB hand-edits). Keep 1 in production.
      KANBAN_PG_APPEND_ONLY: "${KANBAN_PG_APPEND_ONLY:-1}"
      # dataDir for the admin config override + its history (small, persisted).
      KANBAN_DATA_PATH: /app/data/board.jsonl
    volumes:
      - config-data:/app/data
    # Loopback-bound: the write API is unauthenticated (auth is RP3), so it is
    # not reachable beyond this machine. Reach it through the front proxy on
    # :8080 (same-origin). Drop the 127.0.0.1 prefix only for a shared host.
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy

  front:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.front
      # Même transmission de proxy que le middle (npm ci du build front).
      args:
        HTTP_PROXY: ${http_proxy:-}
        HTTPS_PROXY: ${https_proxy:-}
        NO_PROXY: ${no_proxy:-}
    environment:
      MIDDLE_HOST: middle
      MIDDLE_PORT: "8787"
    # Bind address of the ONLY published entry point. Default: loopback —
    # nothing reachable from the network. « Lancer en Docker (reseau).cmd »
    # sets FRONT_BIND=0.0.0.0 to serve other machines through nginx (explicit
    # opt-in; no auth before RP3 → restricted network segments only). middle,
    # db and adminer ALWAYS stay loopback: every access goes through the front.
    ports:
      - "${FRONT_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - middle

  # Web DB editor for DEMO/DEV only (profil `tools`, jamais en production).
  #   docker compose --profile app --profile tools up
  #   -> http://localhost:8081  (Système PostgreSQL · Serveur db · kanban / thuglife · base kanban)
  # Le plugin card-boxes éclate la colonne jsonb `data` (cards, card_events)
  # en boîtes typées par champ — repli JSON brut inclus (docker/adminer/).
  adminer:
    profiles: ["tools"]
    image: adminer:4.17.1@sha256:bb7f148f65aae5916b79a5b7b4ac594f04b17340840cda4c556c84fe4c89b110
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./adminer/card-boxes.php:/var/www/html/plugins-enabled/card-boxes.php:ro
    depends_on:
      - db

volumes:
  db-data:
  config-data:
