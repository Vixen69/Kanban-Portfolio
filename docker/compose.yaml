# App stack for the re-platformed tool (ADR 015).
#
#   docker compose --profile app up --build
#       -> front (nginx :8080) + middle (Express :8787), JSONL store on ./data.
#          Seed ./data first for local testing (see LIVRAISON.md « Tester en
#          local avec Docker »); in production the store is populated by the
#          client's import/sync, not by fixtures.
#
#   docker compose --profile postgres up db
#       -> future PostgreSQL back end. INFRA ONLY: the middle uses JSONL until
#          `pg` is authorised (CLAUDE.md §12 / ADR 011). Not needed to run app.
name: portfolio-kanban
services:
  middle:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.middle
    environment:
      KANBAN_HOST: 0.0.0.0
      KANBAN_PORT: "8787"
      KANBAN_STORAGE_DRIVER: jsonl
      KANBAN_DATA_PATH: /data/board.jsonl
    volumes:
      # Host-seeded JSONL for local testing; the client mounts a real volume.
      - ./data:/data
    ports:
      - "8787:8787"

  front:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.front
    environment:
      MIDDLE_HOST: middle
      MIDDLE_PORT: "8787"
    ports:
      - "8080:80"
    depends_on:
      - middle

  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-dev}
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanban}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
